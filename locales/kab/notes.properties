welcomeAccessNotes=Bac ad tkecmeḍ ar tezmilin-ik seg kra n uselkim n ufus neɣ aselkim n lbiru:
welcomeFormatText=<strong>Akken ad tmuddeḍ amasal i uḍris</strong>, seqdec afeggag n yifecka neɣ tiladniwin-agi :
# LOCALIZATION NOTE (welcomeHeading): #, ##, and ### are the markdown
# syntax to use. Keep the backticks (`) to explain to the user how to use
# the syntax.
welcomeHeading=Azwel: bdu aɛellim s '#" neɣ s '##" neɣ s '###', teǧǧeḍ lewseɛ i wakken ad txedmeḍ azwel 1, azwel wis 2, neɣ azwel wis 3
# LOCALIZATION NOTE (welcomeBold): **text**, and __text__ are the
# markdown syntax example. "text" can be translated. Keep the backticks (`)
# to explain to the user how to use the syntax.
welcomeBold=Tira tazurant: '**aḍṛis**` neɣ `__aḍṛis__`
# LOCALIZATION NOTE (welcomeItalics): *text*, and _text_ are the
# markdown syntax example. "text" can be translated. Keep the backticks (`)
# to explain to the user how to use the syntax.
welcomeItalics=Tira imalen: `*aḍṛis*` neɣ `_aḍṛis_`
# LOCALIZATION NOTE (welcomeBulleted): * and - are the markdown
# syntax example. Keep the backticks (`) to explain to the user how to use
# the syntax.
welcomeBulleted=Tabdart s tneqqiḍin: bdu izirig s '*' neɣ '-' sakin asekkil ilem
# LOCALIZATION NOTE (welcomeNumbered): 1. and 1) are the markdown
# syntax example. Keep the backticks (`) to explain to the user how to use
# the syntax.
welcomeNumbered=Tabdart s wuṭṭunen: bdu izirig s '1' neɣ '1)' sakin asekkil ilem
# LOCALIZATION NOTE (welcomeCode): `text` is the markdown syntax
# example. "text" can be translated. Please keep the backticks (`) to
# explain to the user how to use the syntax.
welcomeCode=Tangalt: ``aḍris``
welcomeThatsIt=<strong>Aqli-ik-id </strong> twejdeḍ i wakken ad ternuḍ tizmilin!

