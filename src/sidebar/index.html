<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Sidebar Notes</title>
    <!-- Emitted by Vite from the SCSS imported in app.jsx. Linked here rather
         than injected from JS so styles are in place before the first paint. -->
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="notes"></div>
    <!-- type="module": the bundle is ESM and loads the editor chunk with a
         native dynamic import. -->
    <script type="module" src="app.js"></script>
  </body>
</html>
