env:
  browser: true
  es6: true
  webextensions: true

parserOptions:
  ecmaFeatures:
    jsx: true
  ecmaVersion: 2020
  sourceType: module

extends:
  - eslint:recommended
  - plugin:react/recommended
  - plugin:jsx-a11y/recommended

plugins:
  - jsx-a11y
  - react

settings:
  react:
    version: "19.0"

root: true

rules:
  # React 19 removed runtime propTypes checking, so the declarations the rule
  # asks for would be dead code. Prop typing should come back via TypeScript
  # or JSDoc rather than prop-types.
  react/prop-types: off
  no-lonely-if: warn
  consistent-return: warn
  eqeqeq: error
  linebreak-style: [error, unix]
  no-console: warn
  no-var: error
  prefer-const: error
  quotes: [error, single]
  semi: [error, always]
